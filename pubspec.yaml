name: bvlgari_advisor
description: "Bvlgari Advisor Portal — MRA Retail Customer Advisor App"
publish_to: 'none'
version: 1.0.9+9

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  fl_chart: ^0.70.2
  go_router: ^14.6.3
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  google_fonts: ^6.2.1
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  http: ^1.6.0
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logobvl.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logobvl.png
    - assets/logo.png
    - assets/
